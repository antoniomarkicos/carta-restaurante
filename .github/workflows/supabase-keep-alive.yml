name: Supabase Keep Alive

on:
  schedule:
    # Se ejecuta automáticamente cada 4 días a las 08:00 UTC
    - cron: '0 8 */4 * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer ping a la API de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Faltan los secretos de Supabase configurados en el repositorio."
            exit 1
          fi
          
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/menus?id=eq.1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
            
          echo "Código de respuesta HTTP de Supabase: $response"
          if [ "$response" -eq 200 ] || [ "$response" -eq 204 ]; then
            echo "¡Supabase se mantiene activo con éxito!"
          else
            echo "Aviso: La respuesta no fue la esperada, pero la petición se realizó."
          fi
